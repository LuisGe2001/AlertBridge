---
#######################
# 01 - Install docker #
#######################
# ***************************
# * Rocky Linux Environment *
# ***************************
- name: Install Docker on Rocky Linux Server
  import_tasks: rl/install_docker.yml
  when: ansible_facts['distribution'] == "Rocky"

# **********************
# * Ubuntu Environment *
# **********************
- name: Install Docker on Ubuntu Server
  import_tasks: ubuntu/install_docker.yml
  when: ansible_facts['distribution'] == "Ubuntu"

# **********************
# * Debian Environment *
# **********************
- name: Install Docker on Debian Server
  import_tasks: debian/install_docker.yml
  when: ansible_facts['distribution'] == "Debian"